<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历工作台 · 风格预览</title>
  <link rel="stylesheet" href="/style-preview/preview.css">
  <script src="/style-preview/preview.js" defer></script>
</head>
<body data-style="a" data-view="list">
  <div class="review-bar">
    <div class="review-label"><span class="review-mark">RW</span><span><strong>页面风格预览</strong><small>同一套功能，比较三种视觉方案</small></span></div>
    <div class="review-switch" role="group" aria-label="选择视觉风格">
      <button type="button" data-choice="a">A · 蓝白工具</button>
      <button type="button" data-choice="b">B · 纸张文档</button>
      <button type="button" data-choice="c">C · 深色专注</button>
    </div>
    <div class="review-switch view-switch" role="group" aria-label="选择预览页面">
      <button type="button" data-page="list">我的简历</button>
      <button type="button" data-page="editor">编辑页面</button>
    </div>
  </div>
  <div class="prototype-note">交互样式稿 · 使用合成示例 · 此页不会读取或修改你的简历</div>
  <main id="prototype" aria-live="polite"></main>
</body>
</html>
