name: local-resume-dev
services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: local_resume
      POSTGRES_USER: local_resume
      POSTGRES_PASSWORD: ${RESUME_DB_PASSWORD:?Run scripts/prepare-db.ps1 first}
    ports:
      - '127.0.0.1:18766:5432'
    volumes:
      - resume_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U local_resume -d local_resume']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  resume_pgdata:
