name: resume-workbench
services:
  app:
    image: ${RESUME_APP_IMAGE:-ghcr.io/mochiuaena/resume-workbench:0.2.0}
    build: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      RESUME_DB_URL: jdbc:postgresql://db:5432/local_resume
      RESUME_DB_USER: local_resume
      RESUME_DB_PASSWORD: ${RESUME_DB_PASSWORD:?Copy .env.example to .env and set a password}
      RESUME_DATA_DIR: /app/data
    ports:
      - '127.0.0.1:${RESUME_PORT:-18765}:18765'
    volumes:
      - resume_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks: [workspace]
    healthcheck:
      test: ['CMD', '/ms-playwright-driver/node', '-e', "require('http').get('http://127.0.0.1:18765/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
  db:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: local_resume
      POSTGRES_USER: local_resume
      POSTGRES_PASSWORD: ${RESUME_DB_PASSWORD:?Set RESUME_DB_PASSWORD}
    volumes:
      - resume_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [workspace]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U local_resume -d local_resume']
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  workspace: {}
volumes:
  resume_data:
  resume_pgdata:
