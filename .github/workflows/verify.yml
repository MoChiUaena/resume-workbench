name: Verify and build
on:
  push:
    branches: [main, deployment-backup]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: local_resume
          POSTGRES_USER: local_resume
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U local_resume -d local_resume"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RESUME_DB_URL: jdbc:postgresql://127.0.0.1:5432/local_resume
      RESUME_DB_USER: local_resume
      RESUME_DB_PASSWORD: ci-test-only
      RESUME_TEST_BASE_URL: http://127.0.0.1:18767
      RESUME_TEST_ISOLATED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run test:unit && npm run build
      - name: Test backend with PostgreSQL
        run: chmod +x mvnw && ./mvnw -B -ntp package
      - name: Verify packaged dependencies and notices
        run: python3 scripts/verify-distribution.py
      - name: Prepare browser and PDF QA
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          python -m pip install pypdf==6.10.0 pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build runnable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: resume-workbench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start two isolated workspaces
        run: |
          mkdir -p .tools/ci/source .tools/ci/target
          cp compose.yml .tools/ci/source/compose.yml
          cp compose.yml .tools/ci/target/compose.yml
          printf 'RESUME_APP_IMAGE=resume-workbench:ci\nRESUME_PORT=18767\n' > .tools/ci/source/.env
          printf 'RESUME_APP_IMAGE=resume-workbench:ci\nRESUME_PORT=18769\n' > .tools/ci/target/.env
          docker compose -p resume-ci-source -f .tools/ci/source/compose.yml --env-file .tools/ci/source/.env up -d --wait --wait-timeout 120
          docker compose -p resume-ci-target -f .tools/ci/target/compose.yml --env-file .tools/ci/target/.env up -d --wait --wait-timeout 120
      - name: Start isolated model protocol fixture
        run: |
          docker run -d --name resume-model-fixture --network container:resume-ci-source-app-1 --mount type=bind,source="$PWD/scripts/qa-model-server.mjs",target=/qa-model-server.mjs,readonly --entrypoint /ms-playwright-driver/node resume-workbench:ci /qa-model-server.mjs
      - name: Cut application egress and verify it is blocked
        run: |
          for app in resume-ci-source-app-1 resume-ci-target-app-1; do
            docker run --rm --cap-add NET_ADMIN --network container:$app --entrypoint /bin/sh postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297 -c 'ip route del default'
            docker exec "$app" /ms-playwright-driver/node -e "const s=require('net').connect({host:'1.1.1.1',port:443});s.setTimeout(4000);s.on('connect',()=>process.exit(1));s.on('error',e=>{console.log('egress blocked: '+e.code);process.exit(0)});s.on('timeout',()=>{console.log('egress blocked: timeout');process.exit(0)});"
          done
      - name: Test browser workflows offline
        working-directory: frontend
        run: npm run test:e2e
      - name: Restore in a fresh instance and check PDFs
        run: |
          python scripts/verify-backup.py --isolated
          python scripts/verify-automatic-backups.py --isolated
          python scripts/verify-webp.py --isolated
          python scripts/verify-model-settings.py --isolated
          python scripts/verify-pdfs.py --stage-c
          python scripts/verify-layout-pdfs.py
          python scripts/verify-template-pdfs.py
          python scripts/verify-redacted-pdfs.py
      - name: Recreate containers without deleting volumes
        run: |
          docker stop resume-model-fixture
          docker rm resume-model-fixture
          for side in source target; do
            docker compose -p resume-ci-$side -f .tools/ci/$side/compose.yml --env-file .tools/ci/$side/.env down
            docker compose -p resume-ci-$side -f .tools/ci/$side/compose.yml --env-file .tools/ci/$side/.env up -d --wait --wait-timeout 120
          done
          docker run -d --name resume-model-fixture --network container:resume-ci-source-app-1 --mount type=bind,source="$PWD/scripts/qa-model-server.mjs",target=/qa-model-server.mjs,readonly --entrypoint /ms-playwright-driver/node resume-workbench:ci /qa-model-server.mjs
          python scripts/verify-backup.py --isolated --check-persistence
          python scripts/verify-automatic-backups.py --isolated --check-persistence
          python scripts/verify-webp.py --isolated --check-persistence
          python scripts/verify-model-settings.py --isolated --check-persistence
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          retention-days: 14
          path: |
            target/surefire-reports/
            output/e2e-results.json
            output/*verification*.json
            output/stage-b-network.json
            src/main/resources/META-INF/third-party/inventory.json
            output/pdf/
            frontend/test-results/
      - name: Verify upgrade from the published schema 2 candidate
        run: |
          for side in source target; do
            docker compose -p resume-ci-$side -f .tools/ci/$side/compose.yml --env-file .tools/ci/$side/.env down
          done
          mkdir -p .tools/ci/upgrade
          cp compose.yml .tools/ci/upgrade/compose.yml
          printf 'RESUME_PORT=18769\n' > .tools/ci/upgrade/.env
          docker pull ghcr.io/mochiuaena/resume-workbench:0.1.0-rc.1
          RESUME_APP_IMAGE=ghcr.io/mochiuaena/resume-workbench:0.1.0-rc.1 docker compose -p resume-ci-upgrade -f .tools/ci/upgrade/compose.yml --env-file .tools/ci/upgrade/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py before --isolated
          RESUME_APP_IMAGE=resume-workbench:ci docker compose -p resume-ci-upgrade -f .tools/ci/upgrade/compose.yml --env-file .tools/ci/upgrade/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py after --isolated
          docker compose -p resume-ci-upgrade -f .tools/ci/upgrade/compose.yml --env-file .tools/ci/upgrade/.env down
          mkdir -p .tools/ci/upgrade-three
          cp compose.yml .tools/ci/upgrade-three/compose.yml
          printf 'RESUME_PORT=18769\n' > .tools/ci/upgrade-three/.env
          docker pull ghcr.io/mochiuaena/resume-workbench:0.2.0
          RESUME_APP_IMAGE=ghcr.io/mochiuaena/resume-workbench:0.2.0 docker compose -p resume-ci-upgrade-three -f .tools/ci/upgrade-three/compose.yml --env-file .tools/ci/upgrade-three/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py before --isolated --source-schema 3 --future-backup output/stage-c-ui-backup.zip
          RESUME_APP_IMAGE=resume-workbench:ci docker compose -p resume-ci-upgrade-three -f .tools/ci/upgrade-three/compose.yml --env-file .tools/ci/upgrade-three/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py after --isolated --source-schema 3
          docker compose -p resume-ci-upgrade-three -f .tools/ci/upgrade-three/compose.yml --env-file .tools/ci/upgrade-three/.env down
          mkdir -p .tools/ci/upgrade-four
          cp compose.yml .tools/ci/upgrade-four/compose.yml
          printf 'RESUME_PORT=18769\n' > .tools/ci/upgrade-four/.env
          docker pull ghcr.io/mochiuaena/resume-workbench:0.4.0
          RESUME_APP_IMAGE=ghcr.io/mochiuaena/resume-workbench:0.4.0 docker compose -p resume-ci-upgrade-four -f .tools/ci/upgrade-four/compose.yml --env-file .tools/ci/upgrade-four/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py before --isolated --source-schema 4
          RESUME_APP_IMAGE=resume-workbench:ci docker compose -p resume-ci-upgrade-four -f .tools/ci/upgrade-four/compose.yml --env-file .tools/ci/upgrade-four/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py after --isolated --source-schema 4
          docker compose -p resume-ci-upgrade-four -f .tools/ci/upgrade-four/compose.yml --env-file .tools/ci/upgrade-four/.env down
          mkdir -p .tools/ci/upgrade-five
          cp compose.yml .tools/ci/upgrade-five/compose.yml
          printf 'RESUME_PORT=18769\n' > .tools/ci/upgrade-five/.env
          docker pull ghcr.io/mochiuaena/resume-workbench:0.5.0
          RESUME_APP_IMAGE=ghcr.io/mochiuaena/resume-workbench:0.5.0 docker compose -p resume-ci-upgrade-five -f .tools/ci/upgrade-five/compose.yml --env-file .tools/ci/upgrade-five/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py before --isolated --source-schema 4 --source-version 0.5.0 --automatic-enabled --unsupported-webp-backup output/webp-cross-instance.zip
          RESUME_APP_IMAGE=resume-workbench:ci docker compose -p resume-ci-upgrade-five -f .tools/ci/upgrade-five/compose.yml --env-file .tools/ci/upgrade-five/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py after --isolated --source-schema 4 --source-version 0.5.0
          docker compose -p resume-ci-upgrade-five -f .tools/ci/upgrade-five/compose.yml --env-file .tools/ci/upgrade-five/.env down
          mkdir -p .tools/ci/upgrade-six
          cp compose.yml .tools/ci/upgrade-six/compose.yml
          printf 'RESUME_PORT=18769\n' > .tools/ci/upgrade-six/.env
          docker pull ghcr.io/mochiuaena/resume-workbench:0.6.0
          RESUME_APP_IMAGE=ghcr.io/mochiuaena/resume-workbench:0.6.0 docker compose -p resume-ci-upgrade-six -f .tools/ci/upgrade-six/compose.yml --env-file .tools/ci/upgrade-six/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py before --isolated --source-schema 4 --source-version 0.6.0 --automatic-enabled
          RESUME_APP_IMAGE=resume-workbench:ci docker compose -p resume-ci-upgrade-six -f .tools/ci/upgrade-six/compose.yml --env-file .tools/ci/upgrade-six/.env up -d --wait --wait-timeout 120
          python scripts/verify-upgrade.py after --isolated --source-schema 4 --source-version 0.6.0
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-evidence
          retention-days: 14
          path: |
            output/upgrade-verification*.json
            output/pdf/release-upgraded*.pdf
      - name: Log in to container registry for tagged release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          docker tag resume-workbench:ci "$image"
          docker push "$image"
          printf 'Published `%s` from `%s` after all checks passed.\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop test services
        if: always()
        run: |
          docker stop resume-model-fixture || true
          docker rm resume-model-fixture || true
          for side in source target upgrade upgrade-three upgrade-four upgrade-five upgrade-six; do
            if [ -f .tools/ci/$side/compose.yml ]; then
              docker compose -p resume-ci-$side -f .tools/ci/$side/compose.yml --env-file .tools/ci/$side/.env down
            fi
          done
