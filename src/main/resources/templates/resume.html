<!doctype html>
<html lang="zh-CN" th:lang="${layout.presentation().language() == 'en' ? 'en' : 'zh-CN'}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${layout.presentation().language() == 'en' ? 'Resume · Local preview' : '中文简历 · 本地预览'}"></title><link rel="stylesheet" href="/print.css"><script src="/paginate.js" defer></script></head>
<body th:class="${layout.cssClasses()}" th:style="${layout.cssVariables()}">
<template id="first-header">
 <header class="resume-header">
  <div class="image-cell left-cell"><div class="image-frame" th:if="${left.shown()}" th:style="${left.frameStyle()}" th:attr="data-kind=${layout.swapImages() ? 'logo' : 'photo'}"><img th:src="${'/api/assets/' + left.id() + '/image'}" th:alt="${layout.swapImages() ? '学校 Logo' : '证件照'}" th:style="${left.imageStyle()}"></div></div>
  <div class="identity"><h1 th:text="${content.name}"></h1><p class="headline" th:text="${content.headline}"></p><div class="contacts">
   <span class="contact-line" th:if="${!#strings.isEmpty(content.phone)}"><svg th:if="${layout.presentation().contactStyle() == 'icons'}" class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-3 2c2 3 3 4 6 6l2-3 5 2v4c0 2-3 2-5 1C9 18 6 15 3 8 2 5 3 3 5 3Z"/></svg><span th:if="${layout.presentation().contactStyle() == 'labels'}" class="contact-label" th:text="${layout.presentation().label('phone')}"></span><span th:text="${content.phone}"></span></span>
   <span class="contact-line" th:if="${!#strings.isEmpty(content.email)}"><svg th:if="${layout.presentation().contactStyle() == 'icons'}" class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg><span th:if="${layout.presentation().contactStyle() == 'labels'}" class="contact-label" th:text="${layout.presentation().label('email')}"></span><span th:text="${content.email}"></span></span>
   <span class="contact-line" th:if="${!#strings.isEmpty(content.location)}"><svg th:if="${layout.presentation().contactStyle() == 'icons'}" class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 6-7 11-7 11S5 16 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></svg><span th:if="${layout.presentation().contactStyle() == 'labels'}" class="contact-label" th:text="${layout.presentation().label('location')}"></span><span th:text="${content.location}"></span></span>
  </div></div>
  <div class="image-cell right-cell"><div class="image-frame" th:if="${right.shown()}" th:style="${right.frameStyle()}" th:attr="data-kind=${layout.swapImages() ? 'photo' : 'logo'}"><img th:src="${'/api/assets/' + right.id() + '/image'}" th:alt="${layout.swapImages() ? '证件照' : '学校 Logo'}" th:style="${right.imageStyle()}"></div></div>
 </header>
</template>
<template id="continuation-header"><header class="continuation"><strong th:text="${content.name}"></strong><span th:text="${content.headline}"></span><small th:text="${layout.presentation().language() == 'en' ? 'CONTINUED' : '经历补充 / CONTINUED'}"></small></header></template>
<template id="footer"><footer class="page-footer"><span th:text="${content.name}"></span><span class="page-number"></span></footer></template>
<div id="source" hidden>
 <section class="resume-section" th:each="section : ${sections}" th:if="${section.visible}" th:attr="data-section=${section.id},data-break=${section.pageBreakBefore}">
  <h2 th:text="${section.title}"></h2>
  <div class="entry" th:each="entry : ${section.entries}">
   <div class="entry-heading"><h3 th:text="${entry.title}"></h3><span th:text="${entry.meta}"></span></div>
   <ul th:if="${entry.bulleted}"><li th:each="bullet : ${entry.bullets}" th:if="${!#strings.isEmpty(bullet)}" th:utext="${bullet}"></li></ul>
   <div class="paragraphs" th:unless="${entry.bulleted}"><p th:each="bullet : ${entry.bullets}" th:if="${!#strings.isEmpty(bullet)}" th:utext="${bullet}"></p></div>
  </div>
 </section>
</div>
<div id="pages"></div><p id="layout-error" hidden th:text="${layout.presentation().language() == 'en' ? 'Content cannot fit safely. Shorten long paragraphs or reduce the font size.' : '当前内容无法安全分页，请缩短单条内容或减小字号。'}"></p>
</body></html>
