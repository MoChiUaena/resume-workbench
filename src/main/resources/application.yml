server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:18765}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${RESUME_DB_URL:jdbc:postgresql://127.0.0.1:18766/local_resume}
    username: ${RESUME_DB_USER:local_resume}
    password: ${RESUME_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 3000
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_UPLOAD_BYTES:5242880}B
      max-request-size: 6MB
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
resume:
  runtime-log-dir: ${RESUME_RUNTIME_LOG_DIR:}
  auto-backup-poll-ms: ${RESUME_AUTO_BACKUP_POLL_MS:60000}
  data-dir: ${RESUME_DATA_DIR:./data}
  max-upload-bytes: ${RESUME_MAX_UPLOAD_BYTES:5242880}
  max-pixels: 24000000
  max-backup-bytes: ${RESUME_MAX_BACKUP_BYTES:268435456}
